<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conrad Gelber</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13233C">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/spectral-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-400-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css?v=10">
<link rel="stylesheet" href="/login/login.css?v=1">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="wrap">

  <header class="mast-sub">
    <p class="site-name"><a href="/">Conrad Gelber</a></p>
  </header>

  <main id="main" class="login">
    <form method="post" action="/login/" class="login-form">
      <input type="text" name="username" autocomplete="username" value="conrad" hidden>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
        autocomplete="current-password" required autofocus maxlength="32"
        aria-describedby="login-msg">
      <button type="submit">Enter</button>
      <p id="login-msg" class="login-msg" role="alert" hidden></p>
    </form>
  </main>

</div>
</body>
</html>
